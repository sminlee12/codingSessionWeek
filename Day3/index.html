<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Sort</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #182230;
      background: #f3f6fb;
    }
    main {
      width: min(560px, calc(100% - 32px));
      padding: 32px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 28px #172b4d18;
    }
    h1 { margin: 0 0 8px; }
    p { color: #526176; }
    .chart {
      height: 250px;
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 18px;
      padding: 20px 12px 0;
      border-bottom: 2px solid #9aa8ba;
    }
    .item {
      width: 72px;
      display: flex;
      flex-direction: column;
      justify-content: end;
      color: white;
      background: #4384e5;
      border-radius: 8px 8px 0 0;
      transition: height 180ms ease, background 180ms ease;
    }
    .item span { padding: 8px 0; font-size: 20px; font-weight: bold; }
    .item small { position: relative; top: 28px; color: #182230; font-size: 14px; }
    .item.comparing { background: #f0a62e; }
    .item.swapped { background: #23a179; }
    button {
      margin-top: 42px;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #245fc0;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #194d9e; }
    button:disabled { background: #8b98aa; cursor: default; }
    #status { min-height: 24px; margin-bottom: 0; font-weight: bold; color: #245fc0; }
  </style>
</head>
<body>
  <main>
    <h1>Bubble Sort</h1>
    <p>Click once to compare the neighboring pair. If the left number is larger, they swap.</p>
    <div class="chart" id="chart" aria-label="Bar chart of numbers"></div>
    <button id="nextButton" type="button">Compare next pair</button>
    <p id="status" aria-live="polite">Ready to sort: 4, 1, 3, 2</p>
  </main>

  <script>
    const numbers = [4, 1, 3, 2];
    const chart = document.getElementById("chart");
    const nextButton = document.getElementById("nextButton");
    const status = document.getElementById("status");
    let leftIndex = 0;
    let swappedThisPass = false;
    let complete = false;

    function drawBars(comparingIndex = -1, swappedIndex = -1) {
      chart.replaceChildren();
      numbers.forEach((number, index) => {
        const bar = document.createElement("div");
        bar.className = "item";
        if (index === comparingIndex || index === comparingIndex + 1) {
          bar.classList.add("comparing");
        }
        if (index === swappedIndex || index === swappedIndex + 1) {
          bar.classList.remove("comparing");
          bar.classList.add("swapped");
        }
        bar.style.height = `${number * 42}px`;
        bar.innerHTML = `<span>${number}</span><small>Number ${number}</small>`;
        chart.appendChild(bar);
      });
    }

    function finishIfSorted() {
      if (!swappedThisPass) {
        complete = true;
        drawBars();
        status.textContent = "Complete! The numbers are sorted: 1, 2, 3, 4.";
        nextButton.disabled = true;
        return true;
      }
      return false;
    }

    nextButton.addEventListener("click", () => {
      if (complete) return;

      if (leftIndex >= numbers.length - 1) {
        if (finishIfSorted()) return;
        leftIndex = 0;
        swappedThisPass = false;
      }

      const currentIndex = leftIndex;
      drawBars(currentIndex);
      const left = numbers[currentIndex];
      const right = numbers[currentIndex + 1];

      if (left > right) {
        numbers[currentIndex] = right;
        numbers[currentIndex + 1] = left;
        swappedThisPass = true;
        drawBars(currentIndex, currentIndex);
        status.textContent = `Compared ${left} and ${right}: swapped. Now ${numbers.join(", ")}.`;
      } else {
        status.textContent = `Compared ${left} and ${right}: no swap. Now ${numbers.join(", ")}.`;
      }

      leftIndex += 1;
      if (leftIndex >= numbers.length - 1) {
        if (finishIfSorted()) return;
        status.textContent += " Pass complete. Click again to start from the left.";
      }
    });

    drawBars();
  </script>
</body>
</html>
